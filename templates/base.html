<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SweetReader{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f0eb; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        :root { --primary: #e8848a; --primary-dark: #d46a70; --primary-light: #f5d4d6; --bg-warm: #fdf6f3; --text-dark: #4a3a3a; --text-light: #8a7a7a; --shadow: 0 4px 20px rgba(232,132,138,0.15); }
        .btn { padding: 8px 20px; border: none; border-radius: 30px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; transition: all 0.3s; font-weight: 500; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; color: var(--text-dark); border: 2px solid var(--primary-light); }
        .btn-outline:hover { background: var(--primary-light); border-color: var(--primary); }
        .btn-success { background: #7bc8a4; color: white; }
        .btn-success:hover { background: #5fb88e; }
        .btn-danger { background: #e8848a; color: white; }
        .btn-danger:hover { background: #d46a70; }
        .btn-ghost { background: transparent; color: var(--text-light); }
        .btn-ghost:hover { background: #f5f0eb; }
        .navbar { background: white; padding: 12px 24px; border-radius: 16px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .navbar .logo { font-size: 24px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 10px; }
        .navbar .logo .sweet { color: var(--primary); }
        .navbar .logo .reader { color: var(--text-dark); }
        .navbar .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 16px 20px; border-radius: 14px; box-shadow: var(--shadow); text-align: center; }
        .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
        .stat-card .label { font-size: 13px; color: var(--text-light); margin-top: 4px; }
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 28px; border-radius: 12px; color: white; display: none; z-index: 999; animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .toast.show { display: block; }
        .toast.success { background: #7bc8a4; }
        .toast.error { background: #e8848a; }
        .toast.info { background: #8ab8d4; }
        @keyframes slideUp { from { transform: translateY(40px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        .hidden { display: none !important; }
        @media (max-width: 768px) { .navbar { flex-direction: column; align-items: stretch; } .navbar .logo { justify-content: center; } .navbar .actions { justify-content: center; } .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo"><span style="font-size:28px;">📚</span><span><span class="sweet">Sweet</span><span class="reader">Reader</span></span></div>
            <div class="actions">
                <a href="/library" class="btn btn-ghost">🏠 书库</a>
                <a href="/categories" class="btn btn-ghost">📂 分类</a>
                {% if current_user.is_authenticated %}
                    <span style="color:var(--text-light);font-size:14px;">🍭 {{ current_user.username }}</span>
                    {% if current_user.is_admin %}
                        <a href="/admin/invite" class="btn btn-success">📧 邀请码</a>
                        <a href="/admin/users" class="btn btn-success">👥 用户管理</a>
                        <a href="/admin/sync" class="btn btn-success">🔄 同步</a>
                    {% endif %}
                    <a href="/logout" class="btn btn-danger">退出</a>
                {% endif %}
            </div>
        </nav>
        {% block content %}{% endblock %}
    </div>
    <div id="toast" class="toast"></div>
    <script>
        function showToast(msg, type) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type; clearTimeout(t._timer); t._timer = setTimeout(function(){ t.classList.remove('show'); }, 3500); }
        var params = new URLSearchParams(window.location.search); var msg = params.get('message'); if (msg) showToast(msg, 'success');
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
