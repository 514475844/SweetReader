{% extends "base.html" %}
{% block title %}管理后台{% endblock %}
{% block extra_css %}
<style>
/* lucky / 我的电脑 风格：左侧功能树 + 右侧详情面板 */
.ah2 { display: flex; min-height: calc(100vh - 120px); background: #fff; border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid rgba(0,0,0,.05); }
body.dark-theme .ah2 { background: #23252b; border-color: #3a3d44; }

/* 左侧导航 */
.ah2-nav { flex: 0 0 248px; background: #faf7f8; border-right: 1px solid #f0e6e6; padding: 16px 12px; overflow-y: auto; }
body.dark-theme .ah2-nav { background: #1f2127; border-color: #34373e; }
.ah2-brand { font-size: 16px; font-weight: 700; color: var(--text-dark); padding: 6px 10px 14px; }
body.dark-theme .ah2-brand { color: #e6e6e6; }
.ah2-nav-group { font-size: 11px; font-weight: 700; color: var(--text-light); letter-spacing: .8px; padding: 14px 10px 6px; text-transform: uppercase; }
.ah2-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; color: var(--text-dark); text-decoration: none; font-size: 14px; transition: background-color .18s ease-out, color .18s ease-out; }
body.dark-theme .ah2-link { color: #dcdcdc; }
.ah2-link:hover { background: rgba(232,132,138,.12); }
.ah2-link.active { background: var(--primary); color: #fff; }
.ah2-ico { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; }
.ai-0 { background: linear-gradient(135deg,#7c5cd6,#a78bfa); }
.ai-1 { background: linear-gradient(135deg,#e8848a,#f2a9ad); }
.ai-2 { background: linear-gradient(135deg,#2f9e8f,#5fd0bf); }
.ai-3 { background: linear-gradient(135deg,#5b8def,#8fb0ff); }
.ai-4 { background: linear-gradient(135deg,#e08a3c,#f0b26b); }
.ai-5 { background: linear-gradient(135deg,#8a6d3b,#c3a373); }
.ah2-lbl { flex: 1; }

/* 右侧详情 */
.ah2-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ah2-overview { padding: 22px; }
.ah2-ov-head { font-size: 18px; color: var(--text-dark); font-weight: 700; margin: 0 0 4px; }
body.dark-theme .ah2-ov-head { color: #e6e6e6; }
.ah2-ov-sub { color: var(--text-light); font-size: 13px; margin-bottom: 16px; }
.ah2-tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
.ah2-tile { background: #faf8f8; border: 1px solid #f0e9e9; border-radius: 14px; padding: 14px 16px; }
body.dark-theme .ah2-tile { background: #2c2f36; border-color: #3a3d44; }
.ah2-tile b { display: block; font-size: 22px; line-height: 1.2; color: var(--text-dark); }
body.dark-theme .ah2-tile b { color: #e6e6e6; }
.ah2-tile span { display: block; font-size: 12px; color: var(--text-light); margin-top: 2px; }
.ah2-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; background: #faf8f8; border: 1px solid #f0e9e9; border-radius: 14px; }
body.dark-theme .ah2-tools { background: #2c2f36; border-color: #3a3d44; }
.ah2-tools .btn-primary { background: #e8848a; border-color: #e8848a; color: #fff; }
.ah2-tools .btn-primary:hover { background: #d46a70; border-color: #d46a70; }
.ah2-scan-msg { font-size: 12px; color: var(--text-light); }
.ah2-frame { flex: 1; width: 100%; border: none; min-height: calc(100vh - 160px); background: #fff; }
body.dark-theme .ah2-frame { background: #23252b; }

@media (max-width: 768px) {
    .ah2 { flex-direction: column; }
    .ah2-nav { flex: none; border-right: none; border-bottom: 1px solid #f0e6e6; display: flex; gap: 6px; overflow-x: auto; }
    body.dark-theme .ah2-nav { border-color: #34373e; }
    .ah2-nav-group { display: none; }
    .ah2-tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
</style>
{% endblock %}
{% block content %}
<div class="ah2">
    <aside class="ah2-nav" id="ahNav">
        <div class="ah2-brand">⚙️ 管理后台</div>

        <div class="ah2-nav-group">书库与内容</div>
        <a class="ah2-link" data-url="/admin/books"><span class="ah2-ico ai-1">📚</span><span class="ah2-lbl">书籍管理</span></a>
        <a class="ah2-link" data-url="/admin/categories"><span class="ah2-ico ai-2">🗂️</span><span class="ah2-lbl">分类管理</span></a>
        <a class="ah2-link" data-url="/admin/broken"><span class="ah2-ico ai-4">🩹</span><span class="ah2-lbl">乱码与损坏</span></a>

        <div class="ah2-nav-group">用户与权限</div>
        <a class="ah2-link" data-url="/admin/users"><span class="ah2-ico ai-0">👤</span><span class="ah2-lbl">用户管理</span></a>
        <a class="ah2-link" data-url="/admin/sub-admins"><span class="ah2-ico ai-3">🛡️</span><span class="ah2-lbl">子管理员</span></a>
        <a class="ah2-link" data-url="/admin/invite"><span class="ah2-ico ai-5">✉️</span><span class="ah2-lbl">邀请码</span></a>

        <div class="ah2-nav-group">系统与插件</div>
        <a class="ah2-link" data-url="/admin/plugins"><span class="ah2-ico ai-2">🔌</span><span class="ah2-lbl">插件管理</span></a>
        <a class="ah2-link" data-url="/admin/logs"><span class="ah2-ico ai-3">📑</span><span class="ah2-lbl">操作日志</span></a>
        <div id="ahPluginGroup"></div>
    </aside>

    <main class="ah2-main">
        <div class="ah2-overview" id="ahWelcome">
            <h2 class="ah2-ov-head">总览</h2>
            <div class="ah2-ov-sub">点击左侧任意功能，在右侧面板中查看与管理。</div>
            <div class="ah2-tiles" id="ahTiles">
                <div class="ah2-tile"><b>—</b><span>藏书</span></div>
                <div class="ah2-tile"><b>—</b><span>分类</span></div>
                <div class="ah2-tile"><b>—</b><span>格式</span></div>
                <div class="ah2-tile"><b>—</b><span>在读</span></div>
            </div>
            <div class="ah2-tools">
                <button type="button" class="btn btn-primary" onclick="scanBooks()">重新扫描书库</button>
                <span class="ah2-scan-msg" id="ahScanMsg">扫描在后台进行，可稍后回来查看。</span>
            </div>
        </div>
        <iframe id="ahFrame" class="ah2-frame" style="display:none"></iframe>
    </main>
</div>
<script>
(function () {
    var nav = document.getElementById('ahNav');
    var frame = document.getElementById('ahFrame');
    var welcome = document.getElementById('ahWelcome');

    function openUrl(url, el) {
        document.querySelectorAll('.ah2-link').forEach(function (l) { l.classList.remove('active'); });
        if (el) el.classList.add('active');
        frame.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'embed=1';
        frame.style.display = 'block';
        welcome.style.display = 'none';
    }

    if (nav) {
        nav.addEventListener('click', function (e) {
            var link = e.target.closest('.ah2-link');
            if (!link) return;
            e.preventDefault();
            openUrl(link.getAttribute('data-url'), link);
        });
    }

    // 概览磁贴
    fetch('/api/library-overview', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            if (!d || !d.success) return;
            var box = document.getElementById('ahTiles');
            if (!box) return;
            var st = d.status || {};
            var tiles = [
                [d.total || 0, '藏书'],
                [d.categories || 0, '分类'],
                [(d.formats || []).length, '格式'],
                [st.reading || 0, '在读']
            ];
            box.innerHTML = tiles.map(function (t) {
                return '<div class="ah2-tile"><b>' + t[0] + '</b><span>' + t[1] + '</span></div>';
            }).join('');
        })
        .catch(function () {});

    // 插件导航（动态追加到 系统与插件 组）
    fetch('/api/plugins/nav', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            if (d.success && d.admin_nav && d.admin_nav.length) {
                var grp = document.getElementById('ahPluginGroup');
                d.admin_nav.forEach(function (n) {
                    var a = document.createElement('a');
                    a.className = 'ah2-link';
                    a.setAttribute('data-url', n.url);
                    a.innerHTML = '<span class="ah2-ico ai-2">🔌</span><span class="ah2-lbl">' + (n.label || n.url) + '</span>';
                    grp.appendChild(a);
                });
            }
        })
        .catch(function () {});
})();
</script>
{% endblock %}
