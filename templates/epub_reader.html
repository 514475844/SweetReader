<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB 阅读器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; background: #f5f0eb; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
        #viewer { flex: 1; overflow: hidden; background: white; position: relative; }
        .controls { display: flex; gap: 10px; padding: 8px 14px; background: #fff; border-bottom: 1px solid #eee; align-items: center; flex-wrap: wrap; }
        .controls button, .controls .back-link { padding: 5px 12px; border: none; border-radius: 6px; cursor: pointer; background: #e8848a; color: #fff; font-size: 13px; text-decoration: none; }
        .controls button:hover, .controls .back-link:hover { background: #d46a70; }
        .controls .back-link { background: #aaa; }
        .controls .back-link:hover { background: #888; }
        .controls .info { color: #888; font-size: 12px; white-space: nowrap; }
        .controls .progress-bar { flex: 1; min-width: 70px; height: 4px; background: #eee; border-radius: 2px; position: relative; }
        .controls .progress-bar .fill { height: 100%; background: #e8848a; border-radius: 2px; width: 0%; transition: width 0.3s; }
        .controls select { padding: 4px 6px; border-radius: 6px; border: 1px solid #e0e0e0; font-size: 13px; background: #fff; cursor: pointer; }
        .error-msg { padding: 60px 20px; text-align: center; color: #c33; font-size: 15px; }
        @media (max-width: 520px) {
            .controls { gap: 6px; padding: 6px 8px; }
            .controls .info { display: none; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <a class="back-link" href="/library" target="_top">← 返回</a>
        <button onclick="window.epubPrev()">◀ 上一页</button>
        <button onclick="window.epubNext()">下一页 ▶</button>
        <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
        <span class="info" id="location">加载中...</span>
        <select id="fontSizeSelect" onchange="window.epubFontSize(this.value)" title="字号">
            <option value="14">小</option>
            <option value="18" selected>中</option>
            <option value="24">大</option>
        </select>
    </div>
    <div id="viewer"></div>
    <script src="/static/js/jszip.min.js?v=20260902"></script>
    <script src="/static/js/epub.min.js?v=20260902"></script>
    <script>
    (function() {
        var qp = new URLSearchParams(window.location.search);
        var bookId = qp.get('id');
        if (!bookId) {
            var seg = window.location.pathname.split('/').filter(Boolean).pop();
            if (/^\d+$/.test(seg)) bookId = seg;
        }
        var statusEl = document.getElementById('location');
        var progressFill = document.getElementById('progressFill');
        var viewerEl = document.getElementById('viewer');
        var book = null, rendition = null, totalLocs = 0, saveTimer = null;

        function showError(msg) {
            viewerEl.innerHTML = '<div class="error-msg">❌ ' + msg + '</div>';
            statusEl.textContent = '加载失败';
        }
        if (!bookId) { showError('缺少书籍 ID'); return; }

        // 翻页后更新进度条并防抖保存进度
        function applyLocation(location) {
            if (!location || !location.start) return;
            var cfi = location.start.cfi;
            var pct = 0, idx = 0;
            try {
                if (book.locations) {
                    pct = book.locations.percentageFromCfi(cfi) || 0;
                    idx = book.locations.locationFromCfi ? book.locations.locationFromCfi(cfi) : 0;
                }
            } catch (e) {}
            pct = Math.min(1, Math.max(0, pct));
            progressFill.style.width = Math.round(pct * 100) + '%';
            statusEl.textContent = idx + ' / ' + totalLocs + ' · ' + Math.round(pct * 100) + '%';
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function() {
                try {
                    fetch('/api/progress/' + bookId, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ progress: pct, location: cfi })
                    });
                } catch (e) {}
            }, 800);
        }

        try {
            book = ePub('/api/read/' + bookId);
        } catch (e) { showError('创建阅读器失败: ' + e.message); return; }

        rendition = book.renderTo('viewer', {
            width: '100%',
            height: '100%',
            flow: 'paginated',
            spread: 'none'
        });
        statusEl.textContent = '⏳ 加载中...';
        var timeoutId = setTimeout(function() {
            statusEl.textContent = '⏰ 加载超时，请检查书籍文件';
        }, 45000);

        Promise.resolve()
            .then(function() { return book.ready; })
            .then(function() {
                // 生成全书位置（用于百分比/进度计算）
                try { return book.locations.generate(1200); } catch (e) { return null; }
            })
            .then(function() {
                try { totalLocs = book.locations.length() || 0; } catch (e) { totalLocs = 0; }
                return fetch('/api/progress/' + bookId, { credentials: 'same-origin' });
            })
            .then(function(r) { return r.json(); })
            .then(function(saved) {
                var cfi = null;
                if (saved && saved.success && saved.location) cfi = saved.location;
                clearTimeout(timeoutId);
                statusEl.textContent = '✅ 加载完成';
                return rendition.display(cfi || undefined);
            })
            .catch(function(err) {
                clearTimeout(timeoutId);
                showError('渲染失败: ' + (err && err.message ? err.message : err));
            });

        window.epubNext = function() { if (rendition) rendition.next(); };
        window.epubPrev = function() { if (rendition) rendition.prev(); };
        window.epubFontSize = function(v) { if (rendition && rendition.themes) rendition.themes.fontSize(v + 'px'); };
    })();
    </script>
</body>
</html>
